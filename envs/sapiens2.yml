# Known-good combination, verified 2026-07-13 against a real run (see
# docs/environment.md). Create with: conda env create -f envs/sapiens2.yml
#
# torch/torchvision's CUDA build tag depends on your driver -- pip will
# pick the right +cuXXX wheel for your system; this was verified against
# torch 2.12.0+cu130 / torchvision 0.27.0+cu130.
name: sapiens2
channels:
  - defaults
dependencies:
  - python=3.12.13
  - pip
  - pip:
      - torch==2.12.0
      - torchvision==0.27.0
      - transformers==5.12.1
      - numpy==2.4.6
      - scipy==1.17.1
      - Pillow==12.2.0
      # predict_keypoints_2d.py imports `sapiens.pose` -- this was missing
      # from this file entirely (found 2026-07-28 while setting up CI:
      # provenance recovered from pip's own direct_url.json on the working
      # dev env, since neither this file nor docs/environment.md recorded
      # it anywhere).
      - git+https://github.com/facebookresearch/sapiens2.git@7e5bae88456ac418ff0e58e74106c9fe192055d4
