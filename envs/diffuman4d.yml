# Known-good combination, verified 2026-07-13 against a real run (see
# docs/environment.md). Create with: conda env create -f envs/diffuman4d.yml
#
# This env intentionally pins an older CUDA build than hloc/sapiens2 -- it
# follows whatever Diffuman4D's own upstream requirements.txt specifies.
# Don't force it to match the other envs' torch/CUDA versions without
# checking Diffuman4D still works against them.
#
# Only torch/torchvision/numpy/scipy/Pillow/pycolmap/diffusers/transformers
# were individually version-checked against the live env; the rest below
# are carried over unpinned from deps/Diffuman4D/requirements.txt and
# deps/BiRefNet/requirements.txt as-is.
name: diffuman4d
channels:
  - defaults
dependencies:
  - python=3.10.20
  - pip
  - pip:
      - torch==2.7.1
      - torchvision==0.22.1
      - numpy==2.2.6
      - scipy==1.15.3
      - Pillow==12.2.0
      - pycolmap==4.0.4
      - diffusers[torch]==0.33.1
      - transformers==4.49.0
      # -- deps/Diffuman4D/requirements.txt --
      - torchmetrics
      - einops
      - hydra-core==1.3.2
      - hydra-colorlog==1.2.0
      - hydra-optuna-sweeper==1.2.0
      - ipdb
      - fire
      - h5py
      - kornia
      - opencv-python
      - ipython==8.20.0
      - timm
      # -- deps/BiRefNet/requirements.txt --
      - scikit-image
      - tqdm
      - prettytable
      - tabulate
      - ipykernel
      - huggingface-hub>0.25
      - accelerate
