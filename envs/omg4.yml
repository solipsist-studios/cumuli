# Package manifest for the `omg4` env: the 4D rotor trainer
# (deps/OMG4/train_scratch.py), the SPM drivers, bake_sogst.py, and
# eval_render.py all run here.
#
# The CUDA extensions (diff-gaussian-rasterization, simple-knn, pointops2)
# are NOT installable from a yml -- they are built from the deps/OMG4
# checkout by deps/OMG4/script/setup_omg4_env.sh, which remains the full
# provisioning path. This file is the package manifest for the same env,
# kept here so the dependency set is pinned and reviewable next to the
# other envs. After `conda env create -f envs/omg4.yml`, run the setup
# script's extension-build tail (or the whole script, which is idempotent
# on the package steps).
#
# torch comes from the cu130 wheel index, expressed below via
# --extra-index-url. Verified combination per
# deps/OMG4/script/ENV_SETUP_NOTES.md: torch 2.13.0+cu130 on python 3.11.
# cupy/cuml are optional accelerators for the SPM path -- the setup script
# treats their install failure as a warning, not an error.
name: omg4
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.13.0
      - torchvision
      - numpy
      - plyfile
      - dahuffman
      - lpips
      - omegaconf
      - imageio
      - imageio-ffmpeg
      - tqdm
      - scikit-learn
      - ninja
      - cupy-cuda13x        # optional (SPM acceleration)
      - cuml-cu13           # optional (SPM acceleration)
      - gsplat              # eval_render.py rasterizer
      - torchmetrics        # eval_render.py SSIM
