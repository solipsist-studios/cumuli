# Known-good combination, verified 2026-07-29 (see docs/environment.md).
# Create with: conda env create -f envs/queen.yml
#
# This is `--generic_env`/`--triangulate_env`'s default target
# (run_unified_pipeline.py) -- was never captured in any committed env
# spec before 2026-07-29 (found when a fresh CI checkout failed with
# "Not a conda environment: .../envs/queen"). The real local "queen" env
# this was recovered from is a much larger, general-purpose environment
# (also used for unrelated local experimentation) -- deliberately NOT
# replicated wholesale here. This lists only what's actually imported by
# the real code path run_unified_pipeline.py exercises through these two
# args (make_sync_grid.py, undistort_frames.py, build_flat_dataset.py,
# build_colmap_sparse.py, run_pose_refinement.py, compute_sync_offsets.py,
# and triangulate_and_project_keypoints.py -> Diffuman4D's
# triangulate_skeleton.py) -- traced by hand, import by import, not
# copied from the full local env's package list.
#
# open3d WAS added back (2026-07-31), correcting an earlier claim in this
# same comment that it "isn't actually imported anywhere in this real
# path" -- that trace only checked top-level imports; real CI failure
# (2026-07-31, first-ever fresh CI build of this env to reach this code
# path) hit `ModuleNotFoundError: No module named 'open3d'` from a
# function-local `import open3d as o3d` buried inside
# triangulate_skeleton.py's write_kp3d_pcd(), which only runs when
# --out_pcd_dir is set -- exactly what this pipeline always passes. Never
# caught locally because the real local "queen" env (see above) already
# had it installed from being a bigger, general-purpose environment.
#
# torch is CPU-only-compatible here -- the one real usage (Diffuman4D's
# camera_parser.py) is plain tensor math (min/max/norm/inv/stack), no
# .cuda()/device placement calls.
name: queen
channels:
  - defaults
dependencies:
  - python=3.11.15
  - pip
  - pip:
      - numpy==2.4.4
      - scipy==1.17.1
      - Pillow==12.2.0
      - plyfile==1.1.3
      - opencv-python==4.13.0.92   # undistort_frames.py's real fisheye undistortion work
      - fire==0.7.1                # triangulate_skeleton.py's own top-level import
      - torch==2.12.0              # Diffuman4D's camera_parser.py -- CPU wheel, see above
      # easyvolcap itself is intentionally NOT listed here -- it needs
      # `pip install --no-deps`, which a conda env yml's single batched
      # pip section can't apply to just one package. Install separately,
      # after this env is created:
      #   conda run -n queen pip install --no-deps \
      #     git+https://github.com/zju3dv/EasyVolcap.git@4cb3c000a31b8764834c79792b355f110d947e75
      # --no-deps skips its full declared dependency set (torch+torchaudio+
      # torchvision+cuda-python+tensorboard+trimesh+open3d+...) -- the real
      # code actually touched here (easyvolcap.utils.console_utils,
      # .utils.parallel_utils, .utils.base_utils) only needs the 5 packages
      # immediately below, traced import-by-import, recursively, by hand.
      - pdbr==0.9.7
      - rich==15.0.0
      - ujson==5.13.0
      - ruamel.yaml==0.19.1
      - tqdm==4.67.3
      # open3d below is unrelated to easyvolcap -- it's triangulate_skeleton.py's
      # own direct import (write_kp3d_pcd()), see this file's header comment.
      - open3d==0.19.0
