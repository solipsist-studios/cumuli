#
# The single pipeline environment. Replaces hloc + sapiens2 + queen + omg4
# (and, if the BiRefNet stack proves compatible, diffuman4d). Create with
# scripts/setup_cumuli_env.sh, NOT with `conda env create` alone: four
# installs cannot be expressed in a yml and live in that script:
#
#   1. hloc: git clone --recurse-submodules @c13273b, then
#      `pip install --no-deps -e`. hloc==1.5 is not on PyPI, and a plain
#      `pip install git+URL` never fetches the SuperGluePretrainedNetwork
#      submodule SuperPoint imports.
#   2. easyvolcap: `pip install --no-deps git+...@4cb3c00`. Its declared
#      dependency set (torch+torchaudio+cuda-python+tensorboard+trimble+
#      open3d+...) would override this file's deliberate pins.
#   3. The OMG4 trainer CUDA extensions (diff-gaussian-rasterization,
#      simple-knn, pointops2), compiled against THIS env's torch from the
#      deps/OMG4 checkout. ABI-bound: changing torch means rebuilding them.
#   4. cupy-cuda13x / cuml-cu13 (optional SPM accelerators; install
#      failure is a warning, not an error).
#
# Anchor pins (immovable without rebuilding the CUDA extensions):
# torch 2.13.0+cu130, the combination the OMG4 extensions were verified
# against (deps/OMG4/script/ENV_SETUP_NOTES.md) and the wheel family
# cupy/cuml bind to. Python is 3.12, not the notes' 3.11: the sapiens
# package declares requires-python >=3.12 (discovered on the first build
# attempt), and the extensions are rebuilt against this env by the setup
# script anyway. pycolmap==4.0.4 on 3.12 is already proven by the
# unit-test CI job (requirements-dev.txt). Everything else was merged from the per-env known-good pins,
# taking the newest where envs disagreed; the integration suite's golden
# reprojection and mask-coverage gates are the drift detectors for that
# choice.
#
# transformers 5.12.1 serves both Sapiens2 (DETR classes) and -- pending
# the setup script's probe -- BiRefNet's dynamically downloaded model
# code, which was previously verified only against 4.49.0. If that probe
# fails, the diffuman4d env stays separate (see docs/environment.md) and
# the "diffuman4d extras" block below can be dropped.
name: cumuli
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.13.0
      - torchvision  # cu130 index pairs it with the torch pin
      - transformers==5.12.1
      - numpy==2.4.6
      - scipy==1.17.1
      - Pillow==12.2.0
      - pycolmap==4.0.4
      - opencv-python==4.13.0.92
      - plyfile==1.1.4
      - fire==0.7.1
      - huggingface_hub==1.19.0
      - gdown  # hloc declares it; harmless and silences pip's resolver
      # hloc's matcher (hloc itself installs --no-deps via the setup
      # script; lightglue is its one runtime dep not already listed here).
      # Commit recovered from the working env's own direct_url.json --
      # the historical hloc.yml omitted it and CI's shallow `import hloc`
      # probe never noticed.
      - git+https://github.com/cvg/LightGlue.git@eb42fee2d71449efb0aa5c10549752b5d75384d8
      # Sapiens2 keypoint stack (predict_keypoints_2d.py imports sapiens.pose)
      - git+https://github.com/facebookresearch/sapiens2.git@7e5bae88456ac418ff0e58e74106c9fe192055d4
      # queen's traced import set (triangulation, generic scripts)
      - open3d==0.19.0
      - pdbr==0.9.7
      - rich==15.0.0
      - ujson==5.13.0
      - ruamel.yaml==0.19.1
      - tqdm==4.67.3
      - matplotlib>=3.4.0  # deps/camera-calibration/requirements.txt
      # trainer / bake / eval (union of envs/omg4.yml and
      # deps/OMG4/script/ENV_SETUP_NOTES.md, which disagreed)
      - dahuffman
      - lpips
      - omegaconf
      - imageio
      - imageio-ffmpeg
      - scikit-learn
      - ninja
      - gsplat
      - torchmetrics
      - kornia
      - imagesize
      # diffuman4d extras: the risky merge (BiRefNet + Diffuman4D tooling
      # on transformers 5 / torch 2.13). Drop this block in the 2-env
      # fallback.
      - diffusers[torch]==0.33.1
      - hydra-core==1.3.2
      - hydra-colorlog==1.2.0
      - hydra-optuna-sweeper==1.2.0
      - einops
      - timm
      - scikit-image
      - h5py
      - accelerate
      - prettytable
      - tabulate
