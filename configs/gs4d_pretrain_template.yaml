#
# Template for the trainer config stage_train4d generates. Brace-delimited
# placeholders are filled by run_unified_pipeline.py via str.format_map; the
# orchestrator is stdlib-only, so this stays a text template rather than a
# parsed YAML document. The value shapes mirror the production pretrain
# configs (OMG4 configs/custom): num_pts 100k and
# batch_size 2 are the measured production defaults, not the upstream
# paper's. lambda_aniso and lambda_depth stay at their off defaults: the
# anisotropy regulariser measurably costs quality (-1.7 dB on a subject
# capture) without fixing the artifact it targeted.
gaussian_dim: 4
time_duration: [0.0, {time_max}]
num_pts: {num_pts}
num_pts_ratio: 1.0
rot_4d: True
force_sh_3d: False
batch_size: {batch_size}
exhaust_test: False

ModelParams:
  sh_degree: 3
  source_path: "{source_path}"
  model_path: "{model_path}"
  images: "images"
  resolution: 1
  white_background: False
  data_device: "cpu"
  eval: True
  extension: ".png"
  num_extra_pts: 0
  loaded_pth: ""
  frame_ratio: 1
  dataloader: True

  PipelineParams:
    convert_SHs_python: False
    compute_cov3D_python: False
    debug: False
    env_map_res: 0
    env_optimize_until: 1000000000
    env_optimize_from: 0
    eval_shfs_4d: True

  OptimizationParams:
    iterations: {iterations}
    position_lr_init: 0.00016
    position_t_lr_init: -1.0
    position_lr_final: 0.0000016
    position_lr_delay_mult: 0.01
    position_lr_max_steps: {iterations}
    feature_lr: 0.0025
    opacity_lr: 0.05
    scaling_lr: 0.005
    rotation_lr: 0.001
    percent_dense: 0.01
    lambda_dssim: 0.2
    thresh_opa_prune: 0.005
    densification_interval: 100
    opacity_reset_interval: 3000
    densify_from_iter: 500
    densify_until_iter: {densify_until_iter}
    densify_grad_threshold: 0.0001
    densify_grad_t_threshold: 0.0001
    densify_until_num_points: {densify_until_num_points}
    final_prune_from_iter: -1
    sh_increase_interval: 1000
