#
# The single pipeline environment. Replaces hloc + sapiens2 + queen + omg4
# + diffuman4d. Create with scripts/setup_cumuli_env.sh, NOT with
# `conda env create` alone: two installs cannot be expressed in a yml and
# live in that script:
#
#   1. hloc: git clone --recurse-submodules @c13273b, then
#      `pip install --no-deps -e`. hloc==1.5 is not on PyPI, and a plain
#      `pip install git+URL` never fetches the SuperGluePretrainedNetwork
#      submodule SuperPoint imports.
#   2. cumuli-core and cumuli-trainer: `pip install --no-deps -e` from the
#      deps/ submodules, so a resolver pass cannot move torch or gsplat.
#      gsplat then JIT-builds its CUDA kernels against THIS env's torch on
#      first use (the setup script triggers that once).
#
# Anchor pins: torch 2.13.0+cu130 and gsplat 1.5.3, the pair cumuli-trainer
# was validated on (RTX 5090, sm_120). Python is 3.12: the sapiens package
# declares requires-python >=3.12. pycolmap==4.0.4 on 3.12 is already proven by the
# unit-test CI job (requirements-dev.txt). Everything else was merged from the per-env known-good pins,
# taking the newest where envs disagreed. The integration suite's golden
# reprojection and mask-coverage gates are the drift detectors for that
# choice.
#
# transformers 5.12.1 serves both Sapiens2 (DETR classes) and BiRefNet's
# dynamically downloaded model code (birefnet_masks.py).
name: cumuli
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.13.0
      - torchvision  # cu130 index pairs it with the torch pin
      - transformers==5.12.1
      - numpy==2.4.6
      - scipy==1.17.1
      - Pillow==12.2.0
      - pycolmap==4.0.4
      - opencv-python==4.13.0.92
      - plyfile==1.1.4
      - huggingface_hub==1.19.0
      - gdown  # hloc declares it. Harmless, and silences pip's resolver
      # hloc's matcher (hloc itself installs --no-deps via the setup
      # script. lightglue is its one runtime dep not already listed here).
      # Commit recovered from the working env's own direct_url.json --
      # the historical hloc.yml omitted it and CI's shallow `import hloc`
      # probe never noticed.
      - git+https://github.com/cvg/LightGlue.git@eb42fee2d71449efb0aa5c10549752b5d75384d8
      # Sapiens2 keypoint stack (scripts/vendor/sapiens2/vis_pose.py imports
      # sapiens.pose; the sapiens package itself imports rich, accelerate
      # and prettytable)
      - git+https://github.com/facebookresearch/sapiens2.git@7e5bae88456ac418ff0e58e74106c9fe192055d4
      - rich==15.0.0
      - accelerate
      - prettytable
      - open3d==0.19.0  # triangulate_and_project_keypoints.py's point cloud
      - tqdm==4.67.3
      - matplotlib>=3.4.0  # deps/camera-calibration/requirements.txt
      # trainer / bake / eval (cumuli-trainer, bake_sogst.py, eval_render.py)
      - lpips
      - omegaconf
      - imageio
      - imageio-ffmpeg
      - scikit-learn
      - ninja
      - gsplat==1.5.3
      - torchmetrics
      - kornia  # also hloc's matchers and BiRefNet's remote code
      - imagesize
      - h5py  # hloc's feature and match files
      # BiRefNet's model code, fetched from Hugging Face at load time
      # (birefnet_masks.py, trust_remote_code), imports these
      - einops
      - timm
