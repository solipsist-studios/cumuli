name: Integration tests (CPU-only)

# Runs the same real, unmocked tests/integration/ suite as
# integration-tests.yml, but entirely on GitHub's free hosted runners --
# no GPU anywhere, including Brush training. Triggers on EVERY pull
# request (unlike integration-tests.yml's path filter), by explicit
# request: this is meant to be the always-on safety net that doesn't
# depend on a self-hosted GPU runner ever being registered.
#
# Getting Brush running CPU-only required real, hard-won fixes (found
# 2026-07-28, see tests/integration/conftest.py's module docstring for
# the full story):
#   - WGPU_BACKEND=gl alone does NOT avoid the GPU on a machine with an
#     NVIDIA driver -- glvnd still hands OpenGL to the NVIDIA implementation.
#     LIBGL_ALWAYS_SOFTWARE=1 + pointing __EGL_VENDOR_LIBRARY_FILENAMES at
#     Mesa's own ICD is what actually forces Mesa's llvmpipe software
#     rasterizer (see test_pipeline_end_to_end.py's pipeline_run fixture).
#     GitHub-hosted runners have no NVIDIA driver at all, so this matters
#     less here than it did on a real GPU dev box, but it's what makes the
#     local reproduction of this workflow behave identically.
#   - The official brush_app v0.3.0 release binary deadlocks on llvmpipe
#     (a burn-fusion internal spinlock race, not a real GPU requirement --
#     confirmed via instruction-pointer sampling, see project memory).
#     That code path no longer exists in brush's main branch. This
#     workflow therefore builds brush-cli from source (build-cpu-brush
#     job below) rather than downloading the release binary.
#
# Provisioning cost (conda envs + Sapiens checkpoints + brush build) is
# real -- see each step's cache below. First run after this workflow (or
# after a cache-busting change) pays the full cost once; every PR after
# that restores from cache. If GitHub's free-tier runner disk (~14GB
# usable) turns out too tight in practice once this actually runs, the
# fix is a larger hosted runner (see runs-on below) or a self-hosted
# CPU-only runner -- not something provable without a real run in Actions.

on:
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not `main` -- see build-cpu-brush below for why. Bump
  # deliberately (re-validate CPU training still works, e.g. via the
  # eval render, before moving this forward), not automatically.
  BRUSH_COMMIT: 3b80985709e2ec04fd6c8622a40e36473647a8e0
  # Static version tag for the Sapiens checkpoint cache -- bump only if
  # the checkpoint files/repos below actually change (they're a fixed
  # released model, so in practice this shouldn't need to move).
  SAPIENS_CACHE_VERSION: v1

jobs:
  build-cpu-brush:
    # Building from source is required, not a style choice -- see the
    # module comment above. Pinned to a specific commit (rather than
    # always tracking brush's main branch) so an upstream regression
    # can't silently break every PR's CI with zero relation to the PR's
    # own change; bump BRUSH_COMMIT deliberately, in its own PR.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Restore cached brush-cli binary
        id: cache
        uses: actions/cache@v4
        with:
          path: brush-cli-bin/brush-cli
          key: brush-cli-${{ env.BRUSH_COMMIT }}

      - name: Install Rust toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Clone brush at pinned commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/ArthurBrussee/brush brush-src
          git -C brush-src checkout "$BRUSH_COMMIT"

      - name: Build brush-cli (release)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: brush-src
        run: cargo build --release -p brush-cli

      - name: Stage binary for cache + downstream job
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p brush-cli-bin
          cp brush-src/target/release/brush-cli brush-cli-bin/brush-cli

      - name: Upload brush-cli artifact
        uses: actions/upload-artifact@v4
        with:
          name: brush-cli-bin
          path: brush-cli-bin/brush-cli
          retention-days: 7

  integration-tests-cpu:
    needs: build-cpu-brush
    runs-on: ubuntu-latest
    # Well above tests/integration/test_pipeline_end_to_end.py's own
    # PIPELINE_TIMEOUT_S_CPU (4h) so that cleaner, more diagnosable
    # failure fires first -- plus real headroom for setup (conda env
    # creation + checkpoint download on a cache miss) and because a
    # GitHub-hosted runner has fewer/slower cores than the 32-core
    # machine PIPELINE_TIMEOUT_S_CPU was calibrated against, so the same
    # pipeline run will likely take longer here. 350 (not more) because
    # GitHub Actions hard-caps a single job's timeout-minutes at 360
    # regardless of plan -- this is as much headroom above 4h as the
    # platform allows.
    timeout-minutes: 350
    env:
      # A runner running this workflow is supposed to have everything the
      # suite needs (once this job's setup steps finish) -- fail loudly on
      # a misconfigured runner instead of the local-machine behavior
      # (clean skip), which here would show up as a green check with zero
      # tests run. See tests/integration/conftest.py's pipeline_prereqs.
      VCP_REQUIRE_PIPELINE_PREREQS: "1"
      VCP_ALLOW_CPU_RENDERING: "1"
      SAPIENS_CHECKPOINT_ROOT: ${{ github.workspace }}/.cache/sapiens_ckpt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download brush-cli artifact
        uses: actions/download-artifact@v4
        with:
          name: brush-cli-bin
          path: brush-cli-bin

      - name: Make brush-cli executable
        run: |
          chmod +x brush-cli-bin/brush-cli
          echo "VCP_BRUSH_APP=$PWD/brush-cli-bin/brush-cli" >> "$GITHUB_ENV"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Free up disk space
        # ~14GB usable on a free-tier runner is tight against 3 conda envs
        # + ~6GB of Sapiens checkpoints + this repo's submodules + a real
        # pipeline run's ~720MB output -- reclaim space from large
        # preinstalled toolchains this workflow never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: false

      - name: Record conda's actual install base
        # Where conda-incubator/setup-miniconda installs to isn't
        # guaranteed stable across its versions/options -- ask conda
        # itself rather than hardcoding a path the cache step below could
        # silently miss (defeating caching) or, worse, restore to a path
        # conda doesn't look in (breaking every `conda run -n X` call).
        shell: bash -l {0}
        run: echo "CONDA_BASE=$(conda info --base)" >> "$GITHUB_ENV"

      - name: Restore cached conda envs
        id: conda-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA_BASE }}/envs
          # Hashes every envs/*.yml (hloc, diffuman4d, sapiens2) -- any
          # pin change in any of them busts all three, which is the safe
          # default (cheap to over-invalidate, expensive to silently run
          # stale deps).
          key: conda-envs-${{ runner.os }}-${{ hashFiles('envs/*.yml') }}

      - name: Create conda envs (cache miss only)
        if: steps.conda-cache.outputs.cache-hit != 'true'
        shell: bash -l {0}
        run: |
          conda env create -f envs/hloc.yml
          conda env create -f envs/diffuman4d.yml
          conda env create -f envs/sapiens2.yml

      - name: Force CPU-only torch wheels (cache miss only)
        # The env YAMLs pin plain torch==X.Y.Z -- on a real GPU dev
        # machine pip resolves that to a CUDA-enabled wheel, which also
        # runs on CPU but drags in several GB of unused nvidia-*
        # runtime-library dependencies. A GitHub-hosted runner has no
        # GPU and no use for those, so re-resolve against PyTorch's own
        # CPU wheel index instead. Versions must match each envs/*.yml's
        # pin exactly -- these are NOT independent version choices.
        if: steps.conda-cache.outputs.cache-hit != 'true'
        shell: bash -l {0}
        run: |
          conda run -n hloc pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.12.0 torchvision==0.27.0
          conda run -n diffuman4d pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.7.1 torchvision==0.22.1
          conda run -n sapiens2 pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.12.0 torchvision==0.27.0

      - name: Reclaim conda/pip package caches (cache miss only)
        # Real CI failure (2026-07-29): the run genuinely ran out of disk
        # space downloading the ~6GB Sapiens checkpoints, on top of 3 fresh
        # conda envs + their pip package caches. conda and pip both keep
        # downloaded package files around by default after install -- safe
        # to clear now, nothing here needs them again this run.
        if: steps.conda-cache.outputs.cache-hit != 'true'
        shell: bash -l {0}
        run: |
          conda clean -afy
          conda run -n hloc pip cache purge
          conda run -n diffuman4d pip cache purge
          conda run -n sapiens2 pip cache purge

      - name: Restore cached Sapiens checkpoints
        id: sapiens-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SAPIENS_CHECKPOINT_ROOT }}
          key: sapiens-checkpoints-${{ env.SAPIENS_CACHE_VERSION }}

      - name: Download Sapiens checkpoints (cache miss only)
        # Same public repos predict_keypoints.py itself auto-downloads
        # from when SAPIENS_CHECKPOINT_ROOT is missing a file (see
        # deps/Diffuman4D/scripts/preprocess/predict_keypoints.py) --
        # fetched here as an explicit pre-flight step instead of relying
        # on that lazy path, because conftest.py's pipeline_prereqs
        # check requires the checkpoint directory to already exist
        # BEFORE pytest starts a single test (see _check_sapiens_checkpoints).
        # ~6GB total; set HF_TOKEN (repo secret) if these repos ever
        # require accepting a gated-model license on Hugging Face.
        if: steps.sapiens-cache.outputs.cache-hit != 'true'
        shell: bash -l {0}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          conda run -n sapiens2 pip install huggingface_hub
          conda run -n sapiens2 python -c "
          from huggingface_hub import snapshot_download, hf_hub_download
          import os
          root = os.environ['SAPIENS_CHECKPOINT_ROOT']
          snapshot_download(repo_id='facebook/detr-resnet-101-dc5', local_dir=f'{root}/detector')
          hf_hub_download(repo_id='facebook/sapiens2-pose-1b', filename='sapiens2_1b_pose.safetensors', local_dir=f'{root}/pose')
          "
          # Real CI failure (2026-07-29): the pose file used to go through
          # hf_hub_download's global cache (~/.cache/huggingface/hub) and
          # then get shutil.copyfile'd into place -- storing this ~6GB
          # checkpoint TWICE at once on an already-tight free-tier disk
          # budget, which ran it out of space mid-copy. local_dir= above
          # (matching how the detector snapshot already worked) downloads
          # straight to the destination instead. Clean up the cache dir
          # regardless, as a second line of defense against library-version
          # differences in exactly how local_dir is implemented.
          rm -rf ~/.cache/huggingface

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests (CPU-only, real pipeline, JUnit XML)
        shell: bash -l {0}
        run: pytest tests/integration -q --junitxml=junit-integration-cpu.xml

      - name: Publish test results as inline PR annotations
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: junit-integration-cpu.xml
          check_name: Integration test results (CPU-only)

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration-cpu-xml
          path: junit-integration-cpu.xml

      - name: Upload run artifacts (pipeline log, trained splat, eval renders, PSNR report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-run-artifacts-cpu
          path: |
            tests/integration/artifacts/pipeline_run.log
            tests/integration/artifacts/*.ply
            tests/integration/artifacts/eval_renders/
            tests/integration/artifacts/psnr_report.json
          if-no-files-found: ignore
