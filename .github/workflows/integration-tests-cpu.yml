name: Integration tests (CPU-only)

# Runs the CPU-capable subset of the real, unmocked tests/integration/
# suite on GitHub's free hosted runners: the pipeline through the
# dataset4d stage (VCP_CPU_PIPELINE=1 stops before the CUDA-only train4d
# stage). Triggers on EVERY pull request, by explicit request: this is
# the always-on safety net that does not depend on a self-hosted GPU
# runner ever being registered. Training, bake, and eval gating run in
# integration-tests.yml on the GPU runner instead.
#
# Provisioning cost (conda envs + Sapiens checkpoints) is real -- see
# each step's cache below. First run after this workflow (or after a
# cache-busting change) pays the full cost once; every PR after that
# restores from cache.

on:
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Static version tag for the Sapiens checkpoint cache -- bump only if
  # the checkpoint files/repos below actually change (they're a fixed
  # released model, so in practice this shouldn't need to move). Bumped
  # to v2 (2026-07-31) when the downloaded checkpoint switched from
  # sapiens2-pose-1b to sapiens2-pose-0.4b (see the download step below)
  # -- a v1 cache would restore the old 1b file under a path this
  # workflow no longer looks for, silently forcing a slow fallback
  # re-download instead of catching the mismatch.
  SAPIENS_CACHE_VERSION: v2

jobs:
  integration-tests-cpu:
    runs-on: ubuntu-latest
    # Well above tests/integration/test_pipeline_end_to_end.py's own
    # PIPELINE_TIMEOUT_S_CPU (2h) so that cleaner, more diagnosable
    # failure fires first -- plus real headroom for setup (conda env
    # creation + checkpoint download on a cache miss) and slower hosted
    # cores. 350 (not more) because GitHub Actions hard-caps a single
    # job's timeout-minutes at 360 regardless of plan.
    timeout-minutes: 350
    env:
      # A runner running this workflow is supposed to have everything the
      # suite needs (once this job's setup steps finish) -- fail loudly on
      # a misconfigured runner instead of the local-machine behavior
      # (clean skip), which here would show up as a green check with zero
      # tests run. See tests/integration/conftest.py's pipeline_prereqs.
      VCP_REQUIRE_PIPELINE_PREREQS: "1"
      VCP_CPU_PIPELINE: "1"
      SAPIENS_CHECKPOINT_ROOT: ${{ github.workspace }}/.cache/sapiens_ckpt
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch the pipeline submodules (not the 4D trainer forks)
        # `submodules: true` would also clone deps/4d-gaussian-splatting and
        # deps/OMG4, which this CPU pipeline run never touches. Init exactly
        # the submodules the capture pipeline wraps -- the same set the old
        # blanket fetch delivered before the trainer forks were vendored.
        run: |
          git submodule update --init \
            deps/camera-calibration deps/Diffuman4D deps/BiRefNet \
            deps/sapiens

      - name: Restore cached ffmpeg debs
        # The apt mirror stalled for hours on 2026-08-19 (two failed runs;
        # even the canonical-mirror fallback below timed out). Cache the debs
        # after one successful install so later runs install fully offline.
        # First-party Ubuntu debs, no new hosts. ImageOS/ImageVersion are
        # preset on hosted runners; an image bump busts the cache so the deb
        # set always matches the image's dependency baseline.
        id: ffmpeg-debs
        uses: actions/cache@v4
        with:
          path: ~/apt-ffmpeg-debs
          key: apt-ffmpeg-${{ env.ImageOS }}-${{ env.ImageVersion }}

      - name: Install ffmpeg (offline, cache hit)
        if: steps.ffmpeg-debs.outputs.cache-hit == 'true'
        timeout-minutes: 4
        run: |
          sudo dpkg -i ~/apt-ffmpeg-debs/*.deb \
            || sudo apt-get install -f -y --no-download
          ffmpeg -version | head -1

      - name: Install ffmpeg
        if: steps.ffmpeg-debs.outputs.cache-hit != 'true'
        # Normally ~20 s. Observed 2026-08-19: apt stalled for 46+ minutes on
        # a runner mirror hang, and only a concurrency cancel ended it -- the
        # job timeout is 350 minutes. Bound the step and retry with short
        # network timeouts so a stall costs minutes and fails loudly. On
        # success the debs are staged for the cache step above (staging dir
        # because actions/cache cannot read the root-owned apt archive).
        timeout-minutes: 8
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for i in 1 2 3; do
            if [ "$i" = "2" ]; then
              # The runners' azure.archive.ubuntu.com mirror stalls
              # occasionally (observed 2026-08-19, ~1h). Fall back to
              # Ubuntu's canonical mirror before the second attempt.
              echo "switching to archive.ubuntu.com" >&2
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
                /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
                /etc/apt/sources.list.d/*.list 2>/dev/null || true
            fi
            sudo apt-get update \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
              && sudo apt-get install -y --no-install-recommends \
                   -o APT::Keep-Downloaded-Packages=true ffmpeg \
              && mkdir -p ~/apt-ffmpeg-debs \
              && sudo cp /var/cache/apt/archives/*.deb ~/apt-ffmpeg-debs/ \
              && sudo chown -R "$USER" ~/apt-ffmpeg-debs \
              && exit 0
            echo "apt attempt $i failed; retrying in 15s" >&2
            sleep 15
          done
          exit 1

      - name: Free up disk space
        # ~14GB usable on a free-tier runner is tight against 4 conda envs
        # + Sapiens checkpoints (~2GB -- the 0.4b pose model, not the
        # unused 1b's ~6GB, see the download step below) + this repo's
        # submodules + a real pipeline run's ~720MB output -- reclaim
        # space from large preinstalled toolchains this workflow never
        # uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker image prune -af || true

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: false

      - name: Record conda's actual install base
        # Where conda-incubator/setup-miniconda installs to isn't
        # guaranteed stable across its versions/options -- ask conda
        # itself rather than hardcoding a path the cache step below could
        # silently miss (defeating caching) or, worse, restore to a path
        # conda doesn't look in (breaking every `conda run -n X` call).
        shell: bash -l {0}
        run: echo "CONDA_BASE=$(conda info --base)" >> "$GITHUB_ENV"

      - name: Restore cached conda envs
        id: conda-cache
        uses: actions/cache@v4
        with:
          # The hloc source dir must be cached WITH the env: hloc is
          # installed editable (see scripts/setup_cumuli_env.sh), so
          # site-packages holds only a pointer and the code lives there.
          # A cache that restored the env without it died on `import hloc`
          # mid-pipeline (2026-08-19).
          path: |
            ${{ env.CONDA_BASE }}/envs
            ~/.cache/cumuli-env/hloc-src
          # Hashes envs/*.yml (now the single cumuli.yml) AND the setup
          # script -- a provisioning change busts the cache even when the
          # yml is untouched. The -v3 suffix retires the five-env entries.
          key: conda-envs-v3-${{ runner.os }}-${{ hashFiles('envs/*.yml', 'scripts/setup_cumuli_env.sh') }}

      - name: Verify restored envs actually import (cache-hit only)
        # A restored cache that passes actions/cache's own checks can still
        # be unusable (the /tmp/hloc-src case above). Probe the one import
        # per env the pipeline cannot run without, and fail HERE with a
        # named cause instead of 25 minutes later inside the pipeline. If
        # this fires, delete the conda-envs cache entry (gh api -X DELETE
        # /repos/{repo}/actions/caches?key=...) and re-run.
        if: steps.conda-cache.outputs.cache-hit == 'true'
        shell: bash -l {0}
        run: |
          conda run -n cumuli python -c "import hloc, lightglue, pycolmap"
          conda run -n cumuli python -c "import torch, transformers, sapiens.pose"
          conda run -n cumuli python -c "import numpy, cv2, open3d, plyfile"
          conda run -n cumuli python -c "import easyvolcap.utils.console_utils"

      - name: Create the cumuli env (cache miss only)
        # One merged env replaces the old five (hloc/diffuman4d/sapiens2/
        # queen/omg4). The setup script's --cpu mode keeps the historical
        # disk discipline: cpu torch is installed BEFORE the rest of the
        # requirements so nothing can drag the multi-GB CUDA-bundled PyPI
        # torch wheel in transitively, pip caching is off, and the trainer
        # CUDA extensions are skipped (train4d never runs here).
        if: steps.conda-cache.outputs.cache-hit != 'true'
        shell: bash -l {0}
        run: bash scripts/setup_cumuli_env.sh --cpu

      - name: Restore cached Sapiens checkpoints
        id: sapiens-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SAPIENS_CHECKPOINT_ROOT }}
          key: sapiens-checkpoints-${{ env.SAPIENS_CACHE_VERSION }}

      - name: Download Sapiens checkpoints (cache miss only)
        # Same public repos predict_keypoints.py itself auto-downloads
        # from when SAPIENS_CHECKPOINT_ROOT is missing a file (see
        # deps/Diffuman4D/scripts/preprocess/predict_keypoints.py) --
        # fetched here as an explicit pre-flight step instead of relying
        # on that lazy path, because conftest.py's pipeline_prereqs
        # check requires the checkpoint directory to already exist
        # BEFORE pytest starts a single test (see _check_sapiens_checkpoints).
        # Downloads the 0.4b pose checkpoint, NOT 1b -- real CI failure
        # (2026-07-31): this step used to pre-fetch the unused 1b
        # checkpoint (~4GB) while CPU mode (see CPU_SAPIENS_MODEL_SIZE in
        # test_pipeline_end_to_end.py) actually needs 0.4b, which then
        # fell back to predict_keypoints.py's own lazy auto-download --
        # through the slower/wasteful global HF cache path this same
        # step's own local_dir= approach exists specifically to avoid
        # (see the comment below) -- and ran the already-tight disk
        # budget out mid-download. Set HF_TOKEN (repo secret) if these
        # repos ever require accepting a gated-model license on
        # Hugging Face.
        if: steps.sapiens-cache.outputs.cache-hit != 'true'
        shell: bash -l {0}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          conda run -n cumuli pip install huggingface_hub
          conda run -n cumuli python -c "
          from huggingface_hub import snapshot_download, hf_hub_download
          import os
          root = os.environ['SAPIENS_CHECKPOINT_ROOT']
          snapshot_download(repo_id='facebook/detr-resnet-101-dc5', local_dir=f'{root}/detector')
          hf_hub_download(repo_id='facebook/sapiens2-pose-0.4b', filename='sapiens2_0.4b_pose.safetensors', local_dir=f'{root}/pose')
          "
          # Real CI failure (2026-07-29): the pose file used to go through
          # hf_hub_download's global cache (~/.cache/huggingface/hub) and
          # then get shutil.copyfile'd into place -- storing this ~6GB
          # checkpoint TWICE at once on an already-tight free-tier disk
          # budget, which ran it out of space mid-copy. local_dir= above
          # (matching how the detector snapshot already worked) downloads
          # straight to the destination instead. Clean up the cache dir
          # regardless, as a second line of defense against library-version
          # differences in exactly how local_dir is implemented.
          rm -rf ~/.cache/huggingface

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run integration tests (CPU-only, real pipeline, JUnit XML)
        shell: bash -l {0}
        # The [resmon] background loop streams memory/disk/top-process into
        # the live log every 20s. Real CI failure (2026-07-29, twice): the
        # runner VM died with a bare "shutdown signal" / exit 143 and zero
        # pytest output -- root cause turned out to be BiRefNet CPU inference
        # peaking at 21.6GB RSS (measured locally), assumed at the time to be
        # against a 16GB VM. [resmon] itself later proved that assumption
        # wrong (2026-07-30, run 30581141971): the real ceiling is only
        # ~7.75GB, discovered when Sapiens keypoint prediction (6.5-7.6GB
        # peak, unrelated to the original BiRefNet fix) swap-thrashed for
        # ~40min and then the whole VM went unresponsive and was killed
        # externally -- confirmed straight from these [resmon] lines, not
        # guessed. If a future stage OOMs the VM, the last [resmon] lines
        # will show memory climbing toward ~7.75GB right before death,
        # instead of leaving another unexplained 143.
        run: |
          (
            while true; do
              echo "[resmon] $(date -u +%H:%M:%S)" \
                "mem=$(free -m | awk 'NR==2{print $3"/"$2"MB"}')" \
                "swap=$(free -m | awk 'NR==3{print $3"/"$2"MB"}')" \
                "disk_avail=$(df -BM --output=avail / | tail -1 | tr -d ' ')" \
                "top=$(ps -eo rss,comm --sort=-rss --no-headers | head -1 | awk '{printf "%s:%dMB", $2, $1/1024}')"
              sleep 20
            done
          ) &
          RESMON_PID=$!
          trap 'kill "$RESMON_PID" 2>/dev/null || true' EXIT
          pytest tests/integration -q --junitxml=junit-integration-cpu.xml

      - name: Publish test results as inline PR annotations
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: junit-integration-cpu.xml
          check_name: Integration test results (CPU-only)

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-integration-cpu-xml
          path: junit-integration-cpu.xml

      - name: Upload run artifacts (pipeline log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-run-artifacts-cpu
          path: |
            tests/integration/artifacts/pipeline_run.log
          if-no-files-found: ignore
